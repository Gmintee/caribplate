[build]
  publish = "."

[build.environment]
  SECRETS_SCAN_ENABLED = "false"

[functions]
  included_files = ["netlify/functions/**"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"

[functions."claude"]
  timeout = 120

[functions."mailchimp"]
  timeout = 30
